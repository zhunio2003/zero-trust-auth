# ============================================================
# CI Pipeline — ZeroTrust Auth Platform
# Se activa en cada push al repositorio.
# Implementación completa
# ============================================================

name: CI - ZeroTrust Auth Plataform

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [ main ]

jobs:
  # ─────────────────────────────────────────────
  # LINT — Java services
  # ─────────────────────────────────────────────
  lint-java:
    name: Lint - Java (Checkstyle)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      
      - name: Grant Gradle wrapper permisions
        run: chmod +x ./gradlew
      
      - name: Run Checkstyle on all Java services
        run: ./gradlew checkstyleMain checkstyleTest

  # ─────────────────────────────────────────────
  # LINT — Python service
  # ─────────────────────────────────────────────
  lint-python:
    name: Lint - Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install Flake8
        run: pip install flake8

      - name: Run Flake8 on m-policy-engine
        run: flake8 services/ml-policy-engine/

  # ─────────────────────────────────────────────
  # TEST — Java services
  # ─────────────────────────────────────────────
  test-java:
    name: Test - Java (JUnit)
    runs-on: ubuntu-latest
    needs: lint-java
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle
      
      - name: Grant Gradle wrapper permission
        run: chmod +x ./gradlew
      
      - name: Run tests on all Java services
        run: ./gradlew test
      
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with: 
          name: java-test-reports
          path: "**/build/report/tests/"

  # ─────────────────────────────────────────────
  # TEST — Python service
  # ─────────────────────────────────────────────
  test-python:
    name: Test - Python (Pytest)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      
      - name: Install dependencies
        run: |
          pip install -r services/ml-policy-engine/requirements.txt
          pip install pytest

      - name: Run pytest on ml-policy-engine
        run: pytest services/ml-policy-engine/tests/ -v
        
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-test-reports
          path: services/ml-policy-engine/tests/