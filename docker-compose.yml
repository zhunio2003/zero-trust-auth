# ============================================================
# docker-compose.yml — ZeroTrust Auth Platform
# ============================================================
services: 
  # ════════════════════════════════════════════
  # RED: PUBLIC — Tráfico externo
  # ════════════════════════════════════════════
  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "80:80"
    networks:
      - public
    restart: unless-stopped

  api-gateway:
    build: 
      context: .
      dockerfile: services/api-gateway/Dockerfile
    container_name: api-gateway
    networks:
      - services
      - public
    ports:
      - "8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      authz-service:
        condition: service_healthy
      audit-log-service:
        condition: service_healthy
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8081
      - AUTHZ_SERVICE_URL=http://authz-service:8082
      - AUDIT_SERVICE_URL=http://audit-log-service:8083
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ════════════════════════════════════════════
  # RED: SERVICES — Microservicios + Mensajería
  # ════════════════════════════════════════════
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: auth-service
    networks:
      - services 
      - data
      - monitoring
    depends_on:
      postgres-authn:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-authn:5432/${POSTGRES_AUTHN_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_AUTHN_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_AUTHN_PASSWORD}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_PRIVATE_KEY_PATH=${JWT_PRIVATE_KEY_PATH}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  authz-service:
    build:
      context: .
      dockerfile: services/authz-service/Dockerfile
    container_name: authz-service
    networks:
      - services 
      - data
      - monitoring
    depends_on:
      postgres-authz:
        condition: service_healthy
      ml-policy-engine:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-authz:5432/${POSTGRES_AUTHZ_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_AUTHZ_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_AUTHZ_PASSWORD}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - ML_POLICY_ENGINE_URL=http://ml-policy-engine:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  ml-policy-engine:
    build:
      context: .
      dockerfile: services/ml-policy-engine/Dockerfile
    container_name: ml-policy-engine
    networks:
      - services 
      - data
      - monitoring
    depends_on:
      mongodb-ml:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://${MONGODB_ML_USER}:${MONGODB_ML_PASSWORD}@mongodb-ml:27017/${MONGODB_ML_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  audit-log-service:
    build:
      context: .
      dockerfile: services/audit-log-service/Dockerfile
    container_name: audit-log-service
    networks:
      - services 
      - data
      - monitoring
    depends_on:
      mongodb-auditlog:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      - MONGODB_URL=mongodb://${MONGODB_AUDIT_USER}:${MONGODB_AUDIT_PASSWORD}@mongodb-auditlog:27017/${MONGODB_AUDIT_DB}
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  kafka: 
    image: apache/kafka:3.9.0
    container_name: kafka
    networks:
      - services
    environment:
      # KRaft mode
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,LOCAL://localhost:9094
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,LOCAL://localhost:9094
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,LOCAL:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_LOG_DIRS=/var/lib/kafka/data
      - CLUSTER_ID=zerotrust-kafka-cluster-01
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9094"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ════════════════════════════════════════════
  # RED: DATA — Bases de datos
  # ════════════════════════════════════════════
  postgres-authn:
    image: postgres:17
    container_name: postgres-authn
    networks:
      - data
    environment:
      - POSTGRES_USER=${POSTGRES_AUTHN_USER}
      - POSTGRES_PASSWORD=${POSTGRES_AUTHN_PASSWORD}
      - POSTGRES_DB=${POSTGRES_AUTHN_DB}
    volumes:
      - postgres_authn_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTHN_USER} -d ${POSTGRES_AUTHN_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgres-authz:
    image: postgres:17
    container_name: postgres-authz
    networks:
      - data
    environment:
      - POSTGRES_USER=${POSTGRES_AUTHZ_USER}
      - POSTGRES_PASSWORD=${POSTGRES_AUTHZ_PASSWORD}
      - POSTGRES_DB=${POSTGRES_AUTHZ_DB}
    volumes:
      - postgres_authz_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTHZ_USER} -d ${POSTGRES_AUTHZ_DB}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  mongodb-auditlog:
    image: mongo:8
    container_name: mongo-auditlog
    networks:
      - data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_AUDIT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_AUDIT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_AUDIT_DB}
    volumes:
      - mongodb_auditlog_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "${MONGODB_AUDIT_USER}", "--password", "${MONGODB_AUDIT_PASSWORD}","--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    
  mongodb-ml:
    image: mongo:8
    container_name: mongo-ml
    networks:
      - data
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_ML_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_ML_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_ML_DB}
    volumes:
      - mongodb_ml_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  redis:
    image: redis:8
    container_name: redis
    networks:
      - data  
    command: ["redis-server", "--requirepass",  "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  # ════════════════════════════════════════════
  # RED: MONITORING — Observabilidad
  # ════════════════════════════════════════════
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - monitoring
    volumes:
      - prometheus_data:/prometheus
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
  
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - monitoring
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

# ════════════════════════════════════════════
# REDES
# ════════════════════════════════════════════
networks:
  public:
    driver: bridge
  services:
    driver: bridge
  data:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge
    internal: true

# ════════════════════════════════════════════
# VOLÚMENES
# ════════════════════════════════════════════
volumes:
  kafka_data:
  postgres_authn_data:
  postgres_authz_data:
  mongodb_auditlog_data:
  mongodb_ml_data:
  redis_data:
  prometheus_data:
  grafana_data:

